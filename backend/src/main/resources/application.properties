spring.application.name=auramusic-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auramusic?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

auramusic.security.jwt.secret=${JWT_SECRET:}
auramusic.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
auramusic.mail.enabled=${MAIL_ENABLED:true}
auramusic.mail.from=${MAIL_FROM:no-reply@auramusic.lat}
auramusic.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
auramusic.auth.password-reset-expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:15}
auramusic.sms.enabled=${TWILIO_SMS_ENABLED:false}
auramusic.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
auramusic.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
auramusic.sms.twilio.from=${TWILIO_SMS_FROM:}
